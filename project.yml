
name: Sight
options:
  bundleIdPrefix: com.kanehedges
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: TEAMID
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:

  Sight:
    type: application
    platform: iOS
    sources:
      - path: SightApp
        excludes:
          - "Info-additions.plist"
      - path: Shared
    info:
      path: SightApp/Info.plist
      properties:
        CFBundleDisplayName: Sight
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Sight does not record audio; this is required by the screen broadcast system.
    entitlements:
      path: SightApp/Sight.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kanehedges.sight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanehedges.sight
        PROVISIONING_PROFILE_SPECIFIER: Sight App Store
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: SightBroadcast
        embed: true

  SightBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: SightBroadcast
        excludes:
          - "Info-additions.plist"
      - path: Shared
    info:
      path: SightBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Sight Screen
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: SightBroadcast/SightBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kanehedges.sight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kanehedges.sight.broadcast
        PROVISIONING_PROFILE_SPECIFIER: Sight Broadcast App Store
